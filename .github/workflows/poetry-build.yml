name: Poetry Build

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      poetry-version:
        description: 'Poetry version to use'
        required: false
        type: string
        default: '1.7.1'
      working-directory:
        description: 'Working directory for the build'
        required: false
        type: string
        default: '.'
      poetry-install-args:
        description: 'Additional Poetry install arguments'
        required: false
        type: string
        default: ''
      poetry-build-args:
        description: 'Additional Poetry build arguments'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ inputs.poetry-version }}
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: ${{ inputs.working-directory }}/.venv
          key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles(format('{0}/poetry.lock', inputs.working-directory)) }}
      
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: poetry install --no-interaction ${{ inputs.poetry-install-args }}
      
      - name: Build with Poetry
        working-directory: ${{ inputs.working-directory }}
        run: poetry build ${{ inputs.poetry-build-args }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poetry-build-artifacts
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7
